<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Shivansh Interiors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo" aria-hidden="true">
      <svg viewBox="0 0 34 34" fill="none"><path d="M3 3H14M3 3V14" stroke="currentColor" stroke-width="1.3"/><path d="M31 31H20M31 31V20" stroke="currentColor" stroke-width="1.3"/><circle cx="17" cy="17" r="2" fill="currentColor"/></svg>
      <span>Shivansh <strong>Interiors</strong></span>
    </div>
    <h1>Admin Sign In</h1>
    <p class="sub">Staff access only</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="auth-error" id="authError"></div>
      <button type="submit" class="auth-submit" id="submitBtn">Sign In</button>
    </form>
  </div>
</div>

<script src="supabase-config.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('authError');
  const submitBtn = document.getElementById('submitBtn');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('is-visible');
  }

  // If someone's already got a valid, authorized session, skip straight
  // to the dashboard instead of showing the login form again.
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      const { data: profile } = await supabaseClient
        .from('admin_profiles').select('id').eq('id', session.user.id).single();
      if (profile) window.location.href = 'admin-dashboard.html';
    }
  })();

  if (new URLSearchParams(window.location.search).has('unauthorized')) {
    showError('That account isn\'t authorized for admin access yet. Contact the site owner.');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('is-visible');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      showError(error.message === 'Invalid login credentials'
        ? 'Incorrect email or password.'
        : error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
      return;
    }

    // Confirm this login is actually an authorized admin before proceeding
    // (see admin-auth.js for why this check matters even though RLS is the
    // real backstop).
    const { data: profile, error: profileError } = await supabaseClient
      .from('admin_profiles').select('id').eq('id', data.user.id).single();

    if (profileError || !profile) {
      await supabaseClient.auth.signOut();
      showError('That account isn\'t authorized for admin access yet. Contact the site owner.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
      return;
    }

    window.location.href = 'admin-dashboard.html';
  });
</script>
</body>
</html>
