<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLUX — Motion &amp; Brand Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --ink:#17151f;
    --muted:#6a6577;
    --meta:#9a94a6;
    --violet:#7c6cff;
    --violet-light:#a99bff;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--white)}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  a{text-decoration:none;color:inherit}

  /* ---------- background video wash ---------- */
  .bg-video{
    position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;
    filter:blur(2px) saturate(1.06);
    transform:scale(1.06);
  }
  .scrim{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background-image:
      radial-gradient(circle at 50% 44%, rgba(255,255,255,0.94) 0%, rgba(255,255,255,0.80) 30%, rgba(255,255,255,0.46) 58%, rgba(255,255,255,0.20) 100%),
      linear-gradient(to bottom, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 18%, rgba(255,255,255,0) 82%, rgba(255,255,255,0.90) 100%);
  }
  .scrim::after{
    content:'';position:absolute;inset:0;
    background-image:radial-gradient(circle, rgba(124,108,255,0.10), transparent 62%);
    background-repeat:no-repeat;
    background-position:50% 46%;
    background-size:640px 640px;
    filter:blur(30px);
  }

  /* ---------- page shell ---------- */
  .page{
    position:relative;z-index:2;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;
    padding:26px clamp(28px,4vw,60px) 28px;
  }

  /* ---------- nav ---------- */
  .nav{display:flex;align-items:center;justify-content:space-between;gap:24px}
  .wordmark{
    display:flex;align-items:center;gap:10px;
    font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:21px;
    letter-spacing:-0.01em;color:var(--ink);
  }
  .mark{
    width:15px;height:15px;border-radius:5px;flex:none;
    background:linear-gradient(150deg,#a99bff,#7c6cff);
    box-shadow:0 4px 14px rgba(124,108,255,.45);
  }
  .nav-links{display:flex;align-items:center;gap:34px}
  .nav-links a{
    font-family:'Inter',sans-serif;font-weight:500;font-size:14px;
    color:var(--muted);transition:color .3s ease;
  }
  .nav-links a:hover{color:var(--ink)}
  .nav-cta{
    background:var(--ink);color:#fff;
    font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:11px;
    padding:11px 20px;border-radius:999px;white-space:nowrap;
    transition:transform .35s var(--ease), box-shadow .35s ease;
  }
  .nav-cta:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(23,21,31,.25)}

  /* ---------- hero ---------- */
  .hero{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
  }
  .kicker{
    display:flex;align-items:center;gap:14px;
    font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:12px;
    letter-spacing:.30em;text-transform:uppercase;color:var(--muted);
    margin-bottom:30px;
  }
  .kicker::before,.kicker::after{content:'';width:26px;height:1px;background:var(--violet)}

  h1{
    font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;
    font-size:clamp(64px,9vw,136px);
    line-height:.92;letter-spacing:-.045em;color:var(--ink);
  }
  h1 .dot{color:var(--violet)}

  .sub{
    font-family:'Inter',sans-serif;font-weight:400;
    font-size:clamp(17px,1.6vw,20px);color:var(--muted);
    max-width:440px;line-height:1.5;
    margin:22px auto 40px;
  }

  .cta-row{display:flex;align-items:center;justify-content:center;gap:26px}
  .btn-primary{
    display:inline-flex;align-items:center;gap:10px;
    background:var(--ink);color:#fff;
    font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:15px;
    padding:15px 30px;border-radius:999px;
    box-shadow:0 18px 40px -12px rgba(23,21,31,.35);
    transition:transform .35s var(--ease), box-shadow .35s ease;
  }
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 22px 46px -10px rgba(23,21,31,.4)}
  .btn-primary .arrow{display:inline-block;transition:transform .35s var(--ease)}
  .btn-primary:hover .arrow{transform:translateX(4px)}

  .btn-text{
    position:relative;
    font-family:'Inter',sans-serif;font-weight:500;font-size:15px;
    color:var(--ink);padding-right:18px;
    transition:color .3s ease;
  }
  .btn-text::after{
    content:'\203A';position:absolute;right:0;top:50%;
    transform:translateY(-50%);color:var(--violet);
    transition:transform .3s ease;
  }
  .btn-text:hover{color:var(--violet)}
  .btn-text:hover::after{transform:translate(4px,-50%)}

  /* ---------- footer meta ---------- */
  .meta{
    display:flex;align-items:center;justify-content:center;gap:14px;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--meta);
  }
  .sep{width:4px;height:4px;border-radius:50%;background:var(--violet);flex:none}

  /* ---------- staggered blur-rise entrance ---------- */
  @keyframes blurRise{
    from{opacity:0;filter:blur(16px);transform:translateY(30px)}
    to{opacity:1;filter:blur(0);transform:translateY(0)}
  }
  .rise{
    opacity:0;
    animation:blurRise 1s var(--ease) forwards;
  }

  @media (prefers-reduced-motion: reduce){
    .rise{opacity:1;animation:none;filter:none;transform:none}
    .bg-video{filter:saturate(1.06)}
  }

  /* ---------- responsive ---------- */
  @media (max-width:720px){
    .nav-links{display:none}
    .cta-row{flex-direction:column;gap:16px}
  }
</style>
</head>
<body>

<video class="bg-video" autoplay muted loop playsinline
  src="https://zxdefgavgwfxastwmmjm.supabase.co/storage/v1/object/public/assets/flux.mp4">
</video>
<div class="scrim" aria-hidden="true"></div>

<div class="page">

  <nav class="nav">
    <a href="#" class="wordmark rise" style="animation-delay:0ms">
      <span class="mark" aria-hidden="true"></span>FLUX
    </a>
    <div class="nav-links">
      <a href="#" class="rise" style="animation-delay:70ms">Work</a>
      <a href="#" class="rise" style="animation-delay:120ms">Studio</a>
      <a href="#" class="rise" style="animation-delay:170ms">Contact</a>
    </div>
    <a href="#" class="nav-cta rise" style="animation-delay:220ms">Start a project</a>
  </nav>

  <main class="hero">
    <p class="kicker rise" style="animation-delay:300ms">Motion &amp; Brand</p>
    <h1 class="rise" style="animation-delay:380ms">Make it move<span class="dot">.</span></h1>
    <p class="sub rise" style="animation-delay:490ms">A studio for brands that refuse to sit still.</p>
    <div class="cta-row rise" style="animation-delay:600ms">
      <a href="#" class="btn-primary">See our work <span class="arrow">&#8594;</span></a>
      <a href="#" class="btn-text">Get in touch</a>
    </div>
  </main>

  <footer class="meta rise" style="animation-delay:720ms">
    <span>Brand identity</span><span class="sep" aria-hidden="true"></span>
    <span>Motion design</span><span class="sep" aria-hidden="true"></span>
    <span>Film &amp; CGI</span>
  </footer>

</div>

<script>
  (function(){
    var v = document.querySelector('.bg-video');
    if (!v) return;
    var tryPlay = function(){ v.play().catch(function(){}); };
    v.addEventListener('canplay', tryPlay);
    window.addEventListener('load', tryPlay);
  })();
</script>

</body>
</html>
